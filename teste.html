<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de armazenamento</title>
<style>
  body{font-family:sans-serif;padding:24px;font-size:18px;}
  input{font-size:18px;padding:10px;width:100%;box-sizing:border-box;margin-bottom:12px;}
  button{font-size:18px;padding:12px 20px;background:#16324E;color:#fff;border:none;border-radius:6px;}
  #status{margin-top:20px;padding:14px;border-radius:8px;background:#eee;font-size:16px;}
</style>
</head>
<body>
  <h2>Teste de armazenamento</h2>
  <p>Digite algo, toque em Salvar, depois feche e abra essa página de novo.</p>
  <input id="campo" placeholder="Digite qualquer coisa aqui">
  <button onclick="salvar()">Salvar</button>
  <div id="status"></div>

  <script>
    function mostrar(){
      const salvo = localStorage.getItem('teste-valor');
      const el = document.getElementById('status');
      if(salvo){
        el.textContent = '✅ Valor encontrado salvo: "' + salvo + '"';
        el.style.background = '#d4f4dd';
      } else {
        el.textContent = '⚠️ Nenhum valor salvo encontrado.';
        el.style.background = '#f4d4d4';
      }
    }
    function salvar(){
      const v = document.getElementById('campo').value;
      try{
        localStorage.setItem('teste-valor', v);
        alert('Salvo! Agora feche essa aba/página e abra de novo pra conferir.');
      }catch(e){
        alert('ERRO ao salvar: ' + e.message);
      }
      mostrar();
    }
    mostrar();
  </script>
</body>
</html>
